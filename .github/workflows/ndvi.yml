name: NDVI Sentinel-2

# Calcula l'NDVI per parcel·la de les noves imatges Sentinel-2 i publica els
# resultats a la release `ndvi-data`. El PC els importa amb `.\setup.ps1 import-ndvi`.

on:
  schedule:
    - cron: "0 5 * * *"   # cada dia a les 05:00 UTC
  workflow_dispatch:
    inputs:
      max_dates:
        description: "Màxim de dates a processar en aquesta execució"
        default: "6"
      dates:
        description: "Dates concretes a (re)processar, separades per espais (YYYY-MM-DD)"
        default: ""
      max_cloud:
        description: "Cobertura màxima de núvols per tile (%)"
        default: "30"

permissions:
  contents: write   # crear/pujar fitxers a les releases

concurrency:
  group: ndvi-pipeline
  cancel-in-progress: false

env:
  NDVI_RELEASE: ndvi-data
  PARCELS_RELEASE: parcels
  GH_TOKEN: ${{ github.token }}

jobs:
  ndvi:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-ndvi.txt

      - name: Instal·lar dependències
        run: pip install -r scripts/requirements-ndvi.txt

      - name: Preparar releases i entrades
        run: |
          if ! gh release view "$PARCELS_RELEASE" >/dev/null 2>&1; then
            echo "::error::Falta la release '$PARCELS_RELEASE' amb parcels.fgb. Executa '.\setup.ps1 publish-parcels' al PC."
            exit 1
          fi
          gh release view "$NDVI_RELEASE" >/dev/null 2>&1 || \
            gh release create "$NDVI_RELEASE" --title "Resultats NDVI" --latest=false \
              --notes "Resultats NDVI per parcel·la generats pel workflow ndvi.yml. Un CSV per data + manifest.json."
          mkdir -p in out
          gh release download "$PARCELS_RELEASE" --pattern parcels.fgb --dir in
          gh release download "$NDVI_RELEASE" --pattern manifest.json --dir in || echo "Sense manifest previ"

      - name: Calcular NDVI
        env:
          MAX_DATES: ${{ inputs.max_dates || '6' }}
          MAX_CLOUD: ${{ inputs.max_cloud || '30' }}
          DATES: ${{ inputs.dates }}
        run: |
          DATE_ARGS=""
          for d in $DATES; do DATE_ARGS="$DATE_ARGS --date $d"; done
          python scripts/gha_ndvi_pipeline.py \
            --parcels in/parcels.fgb \
            --manifest in/manifest.json \
            --out-dir out \
            --release "$NDVI_RELEASE" \
            $DATE_ARGS

      - name: Resum
        if: always()
        run: |
          if [ -f out/manifest.json ]; then
            python -c "
          import json; m = json.load(open('out/manifest.json'))['dates']
          print('| Data | Parcel·les | Tiles |'); print('|---|---|---|')
          for d in sorted(m)[-10:]: print(f\"| {d} | {m[d]['rows']:,} | {len(m[d]['tiles'])} |\")
          " >> "$GITHUB_STEP_SUMMARY"
          fi
